
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Expense Tracker</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="css/style.css">
</head>

<body>


    <nav class="navbar navbar-dark bg-dark">
        <div class="container">
            <span class="navbar-brand mb-0 h1">
                Expense Tracker
            </span>
        </div>
    </nav>

    <main class="container py-4">

    
        <div class="row g-3 mb-4">

            <div class="col-md-4">
                
                  <div class="card text-center summary-card">
                    <div class="card-body">
                        <h5 class="card-title">Total Expenses</h5>
                     
                         <h2 id="totalAmount" class="summary-value">0</h2>
                    </div>
                </div>
            </div>

            <div class="col-md-4">
             
                  <div class="card text-center summary-card">
                    <div class="card-body">
                        <h5 class="card-title">Number of Expenses</h5>
                       
                         <h2 id="expenseCount" class="summary-value">0</h2>
                    </div>
                </div>
            </div>

            <div class="col-md-4">
              
                  <div class="card text-center summary-card">
                    <div class="card-body">
                        <h5 class="card-title">Highest Expense</h5>
                       
                         <h2 id="highestExpense" class="summary-value">0</h2>
                    </div>
                </div>
            </div>

        </div>

      
        <div class="card mb-4">
            <div class="card-body">

                <h4 class="mb-3">Add Expense</h4>

                <form id="expenseForm">

                    <div class="row g-3">

                        <div class="col-md-3">
                            <label for="title" class="form-label">
                                Title
                            </label>

                            <input
                                type="text"
                                id="title"
                                class="form-control"
                            >
                        </div>

                        <div class="col-md-2">
                            <label for="amount" class="form-label">
                                Amount
                            </label>

                            <input
                                type="number"
                                id="amount"
                                class="form-control"
                            >
                        </div>

                        <div class="col-md-3">
                            <label for="category" class="form-label">
                                Category
                            </label>

                            <select id="category" class="form-select">
                                <option value="">Select Category</option>
                                <option value="Food">Food</option>
                                <option value="Transport">Transport</option>
                                <option value="Bills">Bills</option>
                                <option value="Entertainment">Entertainment</option>
                                <option value="Other">Other</option>
                            </select>
                        </div>

                        <div class="col-md-2">
                            <label for="date" class="form-label">
                                Date
                            </label>

                            <input
                                type="date"
                                id="date"
                                class="form-control"
                            >
                        </div>

                        <div class="col-md-2 d-flex align-items-end">
                            <button
                                type="submit"
                                class="btn btn-primary w-100"
                            >
                                Add
                            </button>
                        </div>

                    </div>

                </form>

            </div>
        </div>

    
        <div class="mb-3">

            <label for="categoryFilter" class="form-label">
                Filter by Category
            </label>

            <select id="categoryFilter" class="form-select">
                <option value="all">All</option>
                <option value="Food">Food</option>
                <option value="Transport">Transport</option>
                <option value="Bills">Bills</option>
                <option value="Entertainment">Entertainment</option>
                <option value="Other">Other</option>
            </select>

        </div>

     
        <div id="loadingSpinner" class="text-center d-none">
            <div class="spinner-border" role="status">
                <span class="visually-hidden">Loading...</span>
            </div>
        </div>


        <div id="alertMessage" class="alert d-none" role="alert"></div>

  
        <div class="table-responsive">

            <table class="table table-striped table-bordered">

                <thead>
                    <tr>
                        <th>Title</th>
                        <th>Amount</th>
                        <th>Category</th>
                        <th>Date</th>
                        <th>Actions</th>
                    </tr>
                </thead>

                <tbody id="expenseTableBody">
                </tbody>

            </table>

        </div>

    </main>


  
<div class="modal fade" id="editExpenseModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">

            <div class="modal-header">
                <h5 class="modal-title">Edit Expense</h5>

                <button
                    type="button"
                    class="btn-close"
                    data-bs-dismiss="modal">
                </button>
            </div>

            <div class="modal-body">

                <form id="editExpenseForm">

                    <input type="hidden" id="editId">

                    <div class="mb-3">
                        <label for="editTitle" class="form-label">
                            Title
                        </label>

                        <input
                            type="text"
                            id="editTitle"
                            class="form-control">
                    </div>

                    <div class="mb-3">
                        <label for="editAmount" class="form-label">
                            Amount
                        </label>

                        <input
                            type="number"
                            id="editAmount"
                            class="form-control">
                    </div>

                    <div class="mb-3">
                        <label for="editCategory" class="form-label">
                            Category
                        </label>

                        <select id="editCategory" class="form-select">
                            <option value="Food">Food</option>
                            <option value="Transport">Transport</option>
                            <option value="Bills">Bills</option>
                            <option value="Entertainment">Entertainment</option>
                            <option value="Other">Other</option>
                        </select>
                    </div>

                    <div class="mb-3">
                        <label for="editDate" class="form-label">
                            Date
                        </label>

                        <input
                            type="date"
                            id="editDate"
                            class="form-control">
                    </div>

                </form>

            </div>

            <div class="modal-footer">

                <button
                    type="button"
                    class="btn btn-secondary"
                    data-bs-dismiss="modal">
                    Cancel
                </button>

                <button
                    type="button"
                    id="saveEditBtn"
                    class="btn btn-primary">
                    Save Changes
                </button>

            </div>

        </div>
    </div>
</div>

<script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>


    <script src="js/app.js"></script>

</body>

</html>
